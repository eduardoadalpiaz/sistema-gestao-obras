# Pipeline de integração contínua: roda a cada push e pull request.
name: CI

# quando roda: push na main e todo pull request
on:
  push:
    branches: [main]
  pull_request:

# 3 jobs: back e front rodam juntos; o docker só roda depois dos dois
jobs:
  backend:
    name: Back-end (testes e cobertura)
    runs-on: ubuntu-latest
    # os comandos rodam dentro da pasta backend
    defaults:
      run:
        working-directory: backend
    # banco PostgreSQL de verdade para os testes de integração
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: obras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # endereço do banco de teste (o nome termina em _test)
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/obras_test
    steps:
      # baixa o código do repositório (ação fixada por SHA)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # instala o Node 22 e guarda o cache das dependências
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # instala as versões exatas do lock, sem rodar scripts de pacotes
      - run: npm ci --ignore-scripts
      # confere que o servidor carrega sem erro de sintaxe
      - run: node --check src/server.js
      # roda os testes e falha se a cobertura de linhas ficar abaixo de 75%
      - run: npm run test:coverage

  frontend:
    name: Front-end (testes e build)
    runs-on: ubuntu-latest
    # os comandos rodam dentro da pasta frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      # baixa o código do repositório (ação fixada por SHA)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # instala o Node 22 e guarda o cache das dependências
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # instala as versões exatas do lock, sem rodar scripts de pacotes
      - run: npm ci --ignore-scripts
      # roda os testes e falha se a cobertura de linhas ficar abaixo de 25%
      - run: npm run test:coverage
      # gera o site de produção (confere que compila)
      - run: npm run build
        env:
          VITE_API_BASE: /api

  docker:
    name: Imagens Docker (build)
    runs-on: ubuntu-latest
    # só roda se o back e o front passaram
    needs: [backend, frontend]
    steps:
      # baixa o código do repositório
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # confere que as imagens do back e do front constroem
      - run: docker build -t obras-api ./backend
      - run: docker build -t obras-web ./frontend
