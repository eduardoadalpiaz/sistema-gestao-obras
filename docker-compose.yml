# Sobe tudo no servidor: banco (PostgreSQL), API (Node) e site (Caddy + React).
# Uso: docker compose up -d --build
services:
  # serviço db: banco PostgreSQL 16
  db:
    image: postgres:16-alpine
    # volta sozinho se cair ou se a VM reiniciar
    restart: unless-stopped
    # cria o banco e o usuário; a senha vem do .env
    environment:
      POSTGRES_DB: obras
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # volume: os dados do banco sobrevivem a atualizações
    volumes:
      - pgdata:/var/lib/postgresql/data
    # confere a cada 10 s se o banco está pronto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obras -d obras"]
      interval: 10s
      timeout: 5s
      retries: 5

  # serviço api: construído a partir da pasta backend
  api:
    build: ./backend
    restart: unless-stopped
    # a API só sobe quando o banco estiver saudável
    depends_on:
      db:
        condition: service_healthy
    # configuração da API; os segredos vêm do .env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://obras:${POSTGRES_PASSWORD}@db:5432/obras
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      # aceita requisições só do nosso domínio
      CORS_ORIGIN: https://${DOMAIN}
      # chave da IA só no servidor; vazia desliga a função
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}

  # Observabilidade: o Prometheus lê as métricas da API e o Grafana mostra os gráficos.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    # guarda 7 dias de métricas
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    # configuração só leitura e pasta das métricas
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      # recusa subir sem a senha (o :? exige a variável)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina GRAFANA_PASSWORD no .env}
      # sem cadastro livre e sem acesso anônimo
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    # painéis prontos (só leitura) e dados do Grafana
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  # site + Caddy (HTTPS e proxy da API)
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
      - grafana
    environment:
      DOMAIN: ${DOMAIN}
    # único serviço exposto ao mundo (80/443 produção, 8443 staging)
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    # guarda os certificados HTTPS e a configuração do Caddy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # fala com a rede normal e com a do staging
    networks:
      - default
      - staging-net

# rede criada pelo docker-compose.staging.yml (o deploy sobe o staging primeiro)
networks:
  staging-net:
    name: obras-staging-net
    external: true

# onde os dados ficam guardados
volumes:
  pgdata:
  caddy_data:
  caddy_config:
  promdata:
  grafanadata:
